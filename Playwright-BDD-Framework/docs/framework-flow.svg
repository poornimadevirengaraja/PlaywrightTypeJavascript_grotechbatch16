<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Playwright Cucumber framework flow</title>
  <desc id="description">Gherkin feature scenarios flow through Cucumber, TypeScript step definitions, a Page Object Model, and Playwright to a browser and the practice website. Results return to Cucumber, and failures save screenshots and traces.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172554; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .card-title { font-size: 17px; font-weight: 700; }
      .card-copy { font-size: 13px; fill: #475569; }
      .small-title { font-size: 16px; font-weight: 700; }
      .small-copy { font-size: 13px; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" class="title">How a Cucumber + Playwright test runs</text>
  <text x="600" y="80" text-anchor="middle" class="subtitle">A readable test becomes browser actions, then a checked result</text>

  <g>
    <rect x="28" y="135" width="166" height="150" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="52" cy="160" r="15" fill="#2563eb"/>
    <text x="52" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="111" y="194" text-anchor="middle" class="card-title">Feature</text>
    <text x="111" y="221" text-anchor="middle" class="card-copy">Gherkin story</text>
    <text x="111" y="243" text-anchor="middle" class="card-copy">Given / When / Then</text>
    <text x="111" y="266" text-anchor="middle" class="card-copy">features/*.feature</text>
  </g>
  <path d="M197 210H216" class="arrow"/>
  <g>
    <rect x="220" y="135" width="166" height="150" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <circle cx="244" cy="160" r="15" fill="#16a34a"/>
    <text x="244" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="303" y="194" text-anchor="middle" class="card-title">Cucumber</text>
    <text x="303" y="221" text-anchor="middle" class="card-copy">Reads each step</text>
    <text x="303" y="243" text-anchor="middle" class="card-copy">Finds matching code</text>
    <text x="303" y="266" text-anchor="middle" class="card-copy">Runs in order</text>
  </g>
  <path d="M389 210H408" class="arrow"/>
  <g>
    <rect x="412" y="135" width="166" height="150" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="436" cy="160" r="15" fill="#7c3aed"/>
    <text x="436" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="495" y="194" text-anchor="middle" class="card-title">Step definitions</text>
    <text x="495" y="221" text-anchor="middle" class="card-copy">TypeScript translator</text>
    <text x="495" y="243" text-anchor="middle" class="card-copy">Connects words to</text>
    <text x="495" y="266" text-anchor="middle" class="card-copy">page actions/checks</text>
  </g>
  <path d="M581 210H600" class="arrow"/>
  <g>
    <rect x="604" y="135" width="166" height="150" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <circle cx="628" cy="160" r="15" fill="#ea580c"/>
    <text x="628" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    <text x="687" y="194" text-anchor="middle" class="card-title">Page Object</text>
    <text x="687" y="221" text-anchor="middle" class="card-copy">Knows page locators</text>
    <text x="687" y="243" text-anchor="middle" class="card-copy">Reusable actions</text>
    <text x="687" y="266" text-anchor="middle" class="card-copy">pages/*.page.ts</text>
  </g>
  <path d="M773 210H792" class="arrow"/>
  <g>
    <rect x="796" y="135" width="166" height="150" rx="16" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="820" cy="160" r="15" fill="#0891b2"/>
    <text x="820" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
    <text x="879" y="194" text-anchor="middle" class="card-title">Playwright</text>
    <text x="879" y="221" text-anchor="middle" class="card-copy">Clicks and types</text>
    <text x="879" y="243" text-anchor="middle" class="card-copy">Waits and checks</text>
    <text x="879" y="266" text-anchor="middle" class="card-copy">Controls browser</text>
  </g>
  <path d="M965 210H984" class="arrow"/>
  <g>
    <rect x="988" y="135" width="184" height="150" rx="16" fill="#fdf2f8" stroke="#f472b6" stroke-width="2"/>
    <circle cx="1012" cy="160" r="15" fill="#db2777"/>
    <text x="1012" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text>
    <text x="1080" y="194" text-anchor="middle" class="card-title">Browser + website</text>
    <text x="1080" y="221" text-anchor="middle" class="card-copy">Chromium / Firefox /</text>
    <text x="1080" y="243" text-anchor="middle" class="card-copy">WebKit visits the</text>
    <text x="1080" y="266" text-anchor="middle" class="card-copy">practice page</text>
  </g>

  <path d="M1080 289V342H600V369" class="arrow"/>
  <rect x="250" y="375" width="700" height="105" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="408" text-anchor="middle" class="small-title">Scenario hooks and clean test state</text>
  <text x="600" y="435" text-anchor="middle" class="small-copy">Launch browser once → create a fresh context and page per scenario → close it after the scenario</text>
  <text x="600" y="458" text-anchor="middle" class="small-copy">On failure, keep a screenshot and Playwright trace to help find the cause</text>

  <path d="M445 481V526H407" class="arrow"/>
  <path d="M755 481V526H793" class="arrow"/>
  <rect x="205" y="535" width="405" height="78" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="407" y="566" text-anchor="middle" class="small-title">Cucumber result</text>
  <text x="407" y="590" text-anchor="middle" class="small-copy">Passed / failed scenarios and steps</text>
  <rect x="590" y="535" width="405" height="78" rx="16" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
  <text x="793" y="566" text-anchor="middle" class="small-title">Failure evidence</text>
  <text x="793" y="590" text-anchor="middle" class="small-copy">Screenshot + trace in test-results/</text>
</svg>
